plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase Cloud Messaging is wired only when the project has been given its
// google-services.json (see docs/ANDROID_BETA_DISTRIBUTION.md / PR notes for
// the exact Console step and path: apps/mobile/android/app/google-services.json).
// Applying the plugin without that file fails the build, so a build without
// Firebase config — including CI and any contributor who has not set it up —
// simply skips it and ships an app whose push layer is inert but whose in-app
// inbox is unaffected.
def googleServicesConfig = file("google-services.json")
if (googleServicesConfig.exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn(
        "google-services.json not found at ${googleServicesConfig.path}; " +
        "Firebase push is disabled for this build."
    )
}

def releaseValue = { String name, String fallback = null ->
    def envValue = System.getenv(name)
    if (envValue != null && !envValue.trim().isEmpty()) return envValue.trim()

    if (project.hasProperty(name)) {
        def propertyValue = project.property(name)?.toString()?.trim()
        if (propertyValue) return propertyValue
    }

    return fallback
}

def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
def releaseStoreFile = releaseValue("LEORNIAN_UPLOAD_STORE_FILE")
def releaseStorePassword = releaseValue("LEORNIAN_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = releaseValue("LEORNIAN_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = releaseValue("LEORNIAN_UPLOAD_KEY_PASSWORD")
def releaseWebDeepLinkHost = releaseValue("LEORNIAN_WEB_DEEP_LINK_HOST")
def releaseSigningReady = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it != null && !it.isBlank() }

if (isReleaseTask && !releaseSigningReady) {
    throw new GradleException(
        "Release signing is not configured. Set LEORNIAN_UPLOAD_STORE_FILE, " +
        "LEORNIAN_UPLOAD_STORE_PASSWORD, LEORNIAN_UPLOAD_KEY_ALIAS, and " +
        "LEORNIAN_UPLOAD_KEY_PASSWORD through CI secrets or Gradle properties."
    )
}

if (isReleaseTask && !releaseWebDeepLinkHost) {
    throw new GradleException(
        "Release HTTPS app links are not configured. Set LEORNIAN_WEB_DEEP_LINK_HOST " +
        "to the production web hostname through CI secrets or Gradle properties."
    )
}

android {
    namespace = "io.leornian.campus"
    compileSdk = 36
    // `jni` in the committed dependency graph requires NDK 28.2. Higher NDKs
    // remain backward-compatible with the other Android plugins.
    ndkVersion = "28.2.13676358"

    compileOptions {
        // flutter_local_notifications relies on Java 8+ APIs (java.time), which
        // require core library desugaring to run on older Android versions.
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "io.leornian.campus"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [
            applicationName: "android.app.Application",
            appLabel: "Leornian",
            usesCleartextTraffic: "false",
            deepLinkScheme: releaseValue("LEORNIAN_DEEP_LINK_SCHEME", "io.leornian.campus"),
            registrationDeepLinkHost: releaseValue("LEORNIAN_REGISTRATION_DEEP_LINK_HOST", "register"),
            recoveryDeepLinkHost: releaseValue("LEORNIAN_RECOVERY_DEEP_LINK_HOST", "reset-password"),
            webDeepLinkHost: releaseWebDeepLinkHost ?: "invalid.example",
        ]
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders += [
                usesCleartextTraffic: "true",
            ]
        }
        release {
            manifestPlaceholders += [
                usesCleartextTraffic: "false",
            ]
            if (releaseSigningReady) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Backs coreLibraryDesugaringEnabled above (flutter_local_notifications).
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
